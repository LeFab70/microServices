spring:
    mongodb:
      host: localhost
      port: 27018
      username: fab
      password: fab
      database: customer-db
      authentication-database: admin
server:
  port: 8090
  tomcat:
    accesslog:
      enabled: true
      directory: logs
      prefix: access_log
      suffix: .log
      pattern: '%h %l %u %t "%r" %s %b %D ms'

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    tags:
      application: customer-service