spring:
  application:
    name: billing-service

  cloud:
    discovery:
      enabled: true
    config:
      enabled: false

  datasource:
    url: jdbc:h2:mem:billing_db
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  h2:
    console:
      enabled: true
      path: /h2-console

  sql:
    init:
      mode: never

server:
  port: 8086